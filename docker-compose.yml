# Local Postgres for development and tests. Production uses Supabase.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cinemadle
      POSTGRES_PASSWORD: cinemadle
      POSTGRES_DB: cinemadle
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinemadle"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data:
